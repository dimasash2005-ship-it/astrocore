<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080F">
<title>AstroCore — немає зв'язку</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080F; color: #F0EDF8; font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 24px 24px; }
  .card { max-width: 340px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .core { width: 72px; height: 72px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 50%, #FF4D6A 0 18%, rgba(232,0,42,.5) 19% 34%, transparent 35%);
    box-shadow: 0 0 40px rgba(232,0,42,.35); animation: pulse 2.4s ease-in-out infinite; }
  .core::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed rgba(232,0,42,.45); animation: spin 14s linear infinite; }
  h1 { margin: 6px 0 0; font-size: 22px; }
  p { margin: 0; font-size: 14.5px; line-height: 1.55; color: #A8A4BC; }
  small { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: #E8002A; }
  button { margin-top: 8px; padding: 12px 22px; border-radius: 12px; border: none; cursor: pointer; font: 600 14px inherit; font-family: inherit;
    color: #fff; background: #E8002A; box-shadow: 0 0 22px rgba(232,0,42,.4); }
  @keyframes pulse { 50% { box-shadow: 0 0 60px rgba(232,0,42,.55); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .core, .core::after { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="core" aria-hidden="true"></div>
    <small>Signal lost</small>
    <h1>Немає зв'язку з інтернетом</h1>
    <p>Твій агент працює далі на сервері. Щойно зв'язок повернеться, AstroCore відкриється сам.</p>
    <button onclick="location.reload()">Спробувати ще раз</button>
  </div>
  <script>window.addEventListener("online", () => location.reload())</script>
</body>
</html>
